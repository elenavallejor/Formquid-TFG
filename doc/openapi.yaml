openapi: 3.0.3
info:
  title: FormQuid, operaciones principales
  version: documentacion-1
  description: >-
    Selección de operaciones verificadas en los controladores del backend.
    La lista completa de rutas está en doc/03_api.md. Los DTO Java
    definen los campos completos de las respuestas.
servers:
  - url: http://localhost:8080/api/v1
    description: Entorno local
paths:
  /auth/csrf:
    get:
      summary: Obtener la cookie de protección CSRF
      responses:
        '204':
          description: Cookie XSRF-TOKEN preparada para el navegador
  /auth/login:
    post:
      summary: Iniciar sesión
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada y cookie access_token enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /surveys:
    post:
      summary: Crear una encuesta en borrador
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Encuesta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
  /public/surveys/{publicCode}:
    get:
      summary: Consultar una encuesta por su código público
      parameters:
        - $ref: '#/components/parameters/PublicCode'
      responses:
        '200':
          description: Datos y contenido de la encuesta accesible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
  /public/surveys/{publicCode}/participations:
    post:
      summary: Enviar una participación
      parameters:
        - $ref: '#/components/parameters/PublicCode'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitParticipationRequest'
      responses:
        '201':
          description: Participación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Nombre predeterminado de la cookie JWT.
  parameters:
    PublicCode:
      name: publicCode
      in: path
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 12
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Valor de la cookie XSRF-TOKEN obtenida mediante GET /auth/csrf.
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              format: int64
            email:
              type: string
            name:
              type: string
            role:
              type: string
              enum: [EDITOR, ADMIN, SUPERADMIN]
    CreateSurveyRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        imageKey:
          type: string
        fontFamily:
          type: string
          enum: [OPEN_DYSLEXIC, TIMES_NEW_ROMAN, LEXEND, ARIAL]
        accessMode:
          type: string
          enum: [PUBLIC, PASSWORD_PROTECTED, AUTHENTICATED]
        visibility:
          type: string
          enum: [LISTED, UNLISTED]
        accessPassword:
          type: string
        tags:
          type: array
          maxItems: 10
          items:
            type: string
        category:
          type: string
    SurveyResponse:
      type: object
      description: >-
        Campos principales de SurveyResponseDto. El DTO contiene además
        metadatos, permisos y la estructura del formulario.
      properties:
        id:
          type: integer
          format: int64
        publicCode:
          type: string
          nullable: true
        title:
          type: string
        lifecycleStatus:
          type: string
          enum: [DRAFT, OPEN, CLOSED]
        accessMode:
          type: string
          enum: [PUBLIC, PASSWORD_PROTECTED, AUTHENTICATED]
        visibility:
          type: string
          enum: [LISTED, UNLISTED]
        contentItems:
          type: array
          items:
            type: object
    SubmitParticipationRequest:
      type: object
      required: [answers]
      properties:
        accessPassword:
          type: string
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubmitAnswerRequest'
    SubmitAnswerRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          format: int64
        textValue:
          type: string
        numericValue:
          type: number
        booleanValue:
          type: boolean
        selectedOptions:
          type: array
          items:
            type: object
            required: [optionId]
            properties:
              optionId:
                type: integer
                format: int64
              otherText:
                type: string
        matrixValues:
          type: array
          items:
            type: object
            required: [matrixRowId, numericValue]
            properties:
              matrixRowId:
                type: integer
                format: int64
              numericValue:
                type: number
    ParticipationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicCode:
          type: string
        submittedAt:
          type: string
          format: date-time
        answers:
          type: array
          items:
            type: object
