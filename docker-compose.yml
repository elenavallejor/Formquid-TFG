services:
  backend:
    build:
      context: ./backend
    container_name: formquid-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SURVEY_COVER_STORAGE_PATH: /app/data/survey-covers
    depends_on:
      - mailhog
    ports:
      - "8080:8080"
    volumes:
      - survey-covers:/app/data/survey-covers
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: formquid-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: formquid-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  survey-covers:
