services:
  backend:
    build:
      context: ./backend
    container_name: formquid-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: formquid-frontend
    ports:
      - "5173:80"
    restart: unless-stopped