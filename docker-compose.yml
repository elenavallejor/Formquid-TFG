services:

  backend:
    build:
      context: ./backend
    container_name: formquid-backend

    env_file:
      - .env

    ports:
      - "8080:8080"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: formquid-frontend

    env_file:
      - .env

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped
