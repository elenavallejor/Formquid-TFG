spring.application.name=formquid-backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MailHog local
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:notifications@formquid.local}
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:${FRONTEND_ORIGIN:http://localhost:5173}}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=${SERVER_PORT:8080}

# Importación de plantillas ODT
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Directorio de portadas (montar un volumen persistente en producción)
app.survey-cover.directory=${SURVEY_COVER_STORAGE_PATH:./data/survey-covers}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:180000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:3000}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
