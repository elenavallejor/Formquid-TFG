spring.application.name=formquid-backend

server.port=8080

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:180000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:3000}

security.jwt.secret=FormQuidSecretKeyForJwtAuthenticationMustBeAtLeastThirtyTwoChars
security.jwt.expiration-ms=86400000
