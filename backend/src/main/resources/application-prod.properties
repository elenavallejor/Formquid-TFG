spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&tcpKeepAlive=true&currentSchema=public
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.superadmin.email=${SUPERADMIN_EMAIL}
app.superadmin.password=${SUPERADMIN_PASSWORD}
app.superadmin.name=${SUPERADMIN_NAME}
app.superadmin.institution=${SUPERADMIN_INSTITUTION}

security.jwt.cookie-secure=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
