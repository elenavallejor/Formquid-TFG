spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.superadmin.email=${SUPERADMIN_EMAIL}
app.superadmin.password=${SUPERADMIN_PASSWORD}
app.superadmin.name=${SUPERADMIN_NAME}
app.superadmin.gender=${SUPERADMIN_GENDER:OTHER}
app.superadmin.institution=${SUPERADMIN_INSTITUTION}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

